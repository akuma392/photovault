name: Keep Appwrite Project Active

on:
  schedule:
    # Runs every 3 days at midnight UTC
    - cron: "0 0 */3 * *"
  workflow_dispatch: # Allows manual trigger

jobs:
  ping-appwrite:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Appwrite Database
        run: |
          curl -s -X GET "https://sgp.cloud.appwrite.io/v1/health" \
            -H "X-Appwrite-Project: akuma392"
          echo "Keep-alive ping sent to Appwrite!"
